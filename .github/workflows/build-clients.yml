# Build RevCore-baked RustDesk clients (OSS, no Pro) for Windows / Linux / macOS / Android.
# Bake: RS_PUB_KEY + PROD_RENDEZVOUS_SERVER → remote.r3v.ro

name: Build clients (RevCore)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "rustdesk/rustdesk git tag"
        required: true
        default: "1.5.0"
      build_windows:
        description: "Build Windows x64"
        type: boolean
        default: false
      build_linux:
        description: "Build Linux DEB x64"
        type: boolean
        default: true
      build_macos:
        description: "Build macOS DMG (arm64 + x64)"
        type: boolean
        default: true
      build_android:
        description: "Build Android APK arm64"
        type: boolean
        default: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag }}
  VERSION: ${{ inputs.tag }}
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  FLUTTER_BRIDGE_VERSION: "3.22.3"
  ANDROID_FLUTTER_VERSION: "3.24.5"
  RUST_VERSION: "1.75"
  MAC_RUST_VERSION: "1.81"
  CARGO_NDK_VERSION: "3.1.2"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  CARGO_EXPAND_VERSION: "1.0.95"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  generate-bridge:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout rustdesk
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: ${{ env.TAG }}
          submodules: recursive
          fetch-depth: 1

      - name: Install prerequisites
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake curl gcc git g++ libclang-dev \
            libgtk-3-dev llvm-dev nasm ninja-build pkg-config wget

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt

      - name: Install flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_BRIDGE_VERSION }}
          cache: true

      - name: Install flutter rust bridge deps
        shell: bash
        run: |
          cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml || true
          pushd flutter && flutter pub get && popd

      - name: Run flutter rust bridge
        run: |
          ~/.cargo/bin/flutter_rust_bridge_codegen \
            --rust-input ./src/flutter_ffi.rs \
            --dart-output ./flutter/lib/generated_bridge.dart \
            --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h

      - name: Upload bridge artifact
        uses: actions/upload-artifact@v4
        with:
          name: bridge-artifact
          path: |
            ./src/bridge_generated.rs
            ./src/bridge_generated.io.rs
            ./flutter/lib/generated_bridge.dart
            ./flutter/lib/generated_bridge.freezed.dart
            ./flutter/macos/Runner/bridge_generated.h
            ./flutter/ios/Runner/bridge_generated.h

  windows-x64:
    if: ${{ inputs.build_windows }}
    needs: generate-bridge
    runs-on: windows-2022
    timeout-minutes: 240
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout rustdesk
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: ${{ env.TAG }}
          submodules: recursive
          fetch-depth: 1

      - name: Restore bridge files
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: ./

      - name: Checkout bake script
        uses: actions/checkout@v4
        with:
          path: _revcore
          sparse-checkout: |
            scripts/bake_server.py
          sparse-checkout-cone-mode: false

      - name: Bake RevCore server + key
        shell: pwsh
        env:
          RENDEZVOUS_SERVER: ${{ secrets.RENDEZVOUS_SERVER }}
          RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}
        run: |
          python _revcore/scripts/bake_server.py
          Select-String -Path libs/hbb_common/src/config.rs -Pattern 'RS_PUB_KEY|PROD_RENDEZVOUS_SERVER|RENDEZVOUS_SERVERS' | Select-Object -First 10

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        id: flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Replace engine with rustdesk custom flutter engine
        shell: pwsh
        run: |
          flutter doctor -v
          flutter precache --windows
          $flutterRoot = $env:FLUTTER_ROOT
          if (-not $flutterRoot) { $flutterRoot = "${{ steps.flutter.outputs.CACHE-PATH }}" }
          if (-not $flutterRoot) { $flutterRoot = (Resolve-Path (Join-Path (Split-Path (Get-Command flutter).Source -Parent) "..")).Path }
          $engine = Join-Path $flutterRoot "bin\cache\artifacts\engine\windows-x64-release"
          if (-not (Test-Path $engine)) { throw "Engine dir missing: $engine" }
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          if (Test-Path windows-x64-release) { Remove-Item -Recurse -Force windows-x64-release }
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          $src = "windows-x64-release"
          $nested = Join-Path $src "windows-x64-release"
          if (Test-Path $nested) { $src = $nested }
          Get-ChildItem $src -Force | ForEach-Object {
            Copy-Item -Force -Recurse $_.FullName -Destination $engine
          }

      - name: Patch flutter dropdown (3.24.5)
        shell: bash
        run: |
          if [ -f .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff ]; then
            cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff "$(dirname "$(dirname "$(which flutter)")")"
            cd "$(dirname "$(dirname "$(which flutter)")")"
            git apply flutter_3.24.4_dropdown_menu_enableFilter.diff || true
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: windows-2022-revcore-${{ env.TAG }}

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        shell: bash
        run: |
          if ! "$VCPKG_ROOT/vcpkg" \
            install \
            --triplet x64-windows-static \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"; echo "======"; cat "$_1"; echo "======"
            done
            exit 1
          fi

      - name: Build rustdesk (Flutter Windows)
        shell: pwsh
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          if (-not (Test-Path .\flutter\build\windows\x64\runner\Release\rustdesk.exe)) {
            throw "rustdesk.exe missing after build"
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Recurse -Force .\flutter\build\windows\x64\runner\Release\* dist\

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-revcore-windows-${{ env.TAG }}
          path: dist/**
          if-no-files-found: error

  linux-x64:
    if: ${{ inputs.build_linux }}
    needs: generate-bridge
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Free disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          sudo apt-get update -y
          sudo apt-get install -y \
            clang cmake curl gcc git g++ nasm ninja-build pkg-config wget \
            libayatana-appindicator3-dev libasound2-dev libclang-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgtk-3-dev \
            libpulse-dev libva-dev libxcb-randr0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxdo-dev libxfixes-dev llvm-dev

      - name: Checkout rustdesk
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: ${{ env.TAG }}
          submodules: recursive
          fetch-depth: 1

      - name: Restore bridge files
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: ./

      - name: Checkout bake script
        uses: actions/checkout@v4
        with:
          path: _revcore
          sparse-checkout: |
            scripts/bake_server.py
          sparse-checkout-cone-mode: false

      - name: Bake RevCore server + key
        env:
          RENDEZVOUS_SERVER: ${{ secrets.RENDEZVOUS_SERVER }}
          RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}
        run: |
          python3 _revcore/scripts/bake_server.py
          grep -E 'RS_PUB_KEY|PROD_RENDEZVOUS_SERVER|RENDEZVOUS_SERVERS' libs/hbb_common/src/config.rs | head -10

      - name: Disable rust bridge crate types
        run: sed -i 's/\["cdylib", "staticlib", "rlib"\]/["cdylib"]/g' Cargo.toml

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-unknown-linux-gnu
          components: rustfmt

      - name: Install flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        run: |
          sudo apt-get install -y libva-dev
          if ! "$VCPKG_ROOT/vcpkg" install --triplet x64-linux --x-install-root="$VCPKG_ROOT/installed"; then
            find "$VCPKG_ROOT" -name "*.log" -print -exec head -n 80 {} \;
            exit 1
          fi

      - name: Build Flutter Linux + DEB
        run: |
          python3 ./build.py --flutter --hwcodec --unix-file-copy-paste
          ls -lah ./*.deb || ls -lah flutter/build/linux/*/release/bundle || true
          mkdir -p dist
          cp -v ./*.deb dist/ 2>/dev/null || true
          if [ ! -f dist/*.deb ]; then
            # fallback: ship bundle as tar.gz
            BUNDLE=$(find flutter/build/linux -type d -path '*/release/bundle' | head -1)
            tar -C "$(dirname "$BUNDLE")" -czf "dist/RevCore-Remote-Linux-x64.tar.gz" "$(basename "$BUNDLE")"
          else
            mv dist/*.deb "dist/RevCore-Remote-Linux-x64.deb"
          fi
          ls -lah dist/

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-revcore-linux-${{ env.TAG }}
          path: dist/**
          if-no-files-found: error

  macos:
    if: ${{ inputs.build_macos }}
    needs: generate-bridge
    runs-on: ${{ matrix.job.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        job:
          - { target: aarch64-apple-darwin, os: macos-14, arch: aarch64, vcpkg-triplet: arm64-osx, extra: "--screencapturekit" }
          - { target: x86_64-apple-darwin, os: macos-15-intel, arch: x86_64, vcpkg-triplet: x64-osx, extra: "" }
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout rustdesk
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: ${{ env.TAG }}
          submodules: recursive
          fetch-depth: 1

      - name: Restore bridge files
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: ./

      - name: Checkout bake script
        uses: actions/checkout@v4
        with:
          path: _revcore
          sparse-checkout: |
            scripts/bake_server.py
          sparse-checkout-cone-mode: false

      - name: Bake RevCore server + key
        env:
          RENDEZVOUS_SERVER: ${{ secrets.RENDEZVOUS_SERVER }}
          RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}
        run: |
          python3 _revcore/scripts/bake_server.py
          grep -E 'RS_PUB_KEY|PROD_RENDEZVOUS_SERVER|RENDEZVOUS_SERVERS' libs/hbb_common/src/config.rs | head -10

      - name: Install build runtime
        run: |
          brew install llvm create-dmg
          if ! command -v pkg-config &>/dev/null; then brew install pkg-config; fi
          wget https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/macosx/nasm-2.16.03-macosx.zip
          unzip -o nasm-2.16.03-macosx.zip
          sudo cp nasm-2.16.03/nasm /usr/local/bin/nasm
          nasm --version

      - name: Install flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Patch flutter
        run: |
          cd "$(dirname "$(dirname "$(which flutter)")")"
          if [[ -f "${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff" ]]; then
            git apply "${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff" || true
          fi
          # flutter issue 133533
          sed -i -e 's/_setFramesEnabledState(false);/\/\/_setFramesEnabledState(false);/g' \
            packages/flutter/lib/src/scheduler/binding.dart || true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.MAC_RUST_VERSION }}
          targets: ${{ matrix.job.target }}
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: revcore-${{ matrix.job.os }}-${{ env.TAG }}

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        run: |
          if ! "$VCPKG_ROOT/vcpkg" install --x-install-root="$VCPKG_ROOT/installed"; then
            find "$VCPKG_ROOT" -name "*.log" -print -exec head -n 80 {} \;
            exit 1
          fi

      - name: Build rustdesk macOS
        run: |
          if [ "${{ matrix.job.target }}" = "aarch64-apple-darwin" ]; then
            MIN_MACOS_VERSION="12.3"
            sed -i -e "s/MACOSX_DEPLOYMENT_TARGET\=[0-9]*.[0-9]*/MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS_VERSION}/" build.py
            sed -i -e "s/platform :osx, '.*'/platform :osx, '${MIN_MACOS_VERSION}'/" flutter/macos/Podfile
            sed -i -e "s/osx_minimum_system_version = \"[0-9]*.[0-9]*\"/osx_minimum_system_version = \"${MIN_MACOS_VERSION}\"/" Cargo.toml
            sed -i -e "s/MACOSX_DEPLOYMENT_TARGET = [0-9]*.[0-9]*;/MACOSX_DEPLOYMENT_TARGET = ${MIN_MACOS_VERSION};/" flutter/macos/Runner.xcodeproj/project.pbxproj
          fi
          ./build.py --flutter --hwcodec --unix-file-copy-paste ${{ matrix.job.extra }}

      - name: Create DMG
        run: |
          CREATE_DMG="$(command -v create-dmg)"
          CREATE_DMG="$(readlink -f "$CREATE_DMG")"
          sed -i -e 's/MAXIMUM_UNMOUNTING_ATTEMPTS=3/MAXIMUM_UNMOUNTING_ATTEMPTS=7/' "$CREATE_DMG"
          OUT="RevCore-Remote-macOS-${{ matrix.job.arch }}.dmg"
          create-dmg --icon "RustDesk.app" 200 190 --hide-extension "RustDesk.app" \
            --window-size 800 400 --app-drop-link 600 185 \
            "$OUT" ./flutter/build/macos/Build/Products/Release/RustDesk.app
          mkdir -p dist
          mv "$OUT" dist/
          ls -lah dist/

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-revcore-macos-${{ matrix.job.arch }}-${{ env.TAG }}
          path: dist/**
          if-no-files-found: error

  android-arm64:
    if: ${{ inputs.build_android }}
    needs: generate-bridge
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Free disk
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake curl gcc-multilib git g++ g++-multilib \
            libayatana-appindicator3-dev libasound2-dev libc6-dev libclang-dev \
            libunwind-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgtk-3-dev libpulse-dev libva-dev libxcb-randr0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxdo-dev libxfixes-dev llvm-dev nasm ninja-build \
            openjdk-17-jdk-headless pkg-config tree wget

      - name: Checkout rustdesk
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: ${{ env.TAG }}
          submodules: recursive
          fetch-depth: 1

      - name: Restore bridge files
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: ./

      - name: Checkout bake script
        uses: actions/checkout@v4
        with:
          path: _revcore
          sparse-checkout: |
            scripts/bake_server.py
          sparse-checkout-cone-mode: false

      - name: Bake RevCore server + key
        env:
          RENDEZVOUS_SERVER: ${{ secrets.RENDEZVOUS_SERVER }}
          RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}
        run: |
          python3 _revcore/scripts/bake_server.py
          grep -E 'RS_PUB_KEY|PROD_RENDEZVOUS_SERVER|RENDEZVOUS_SERVERS' libs/hbb_common/src/config.rs | head -10

      - name: Install flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.ANDROID_FLUTTER_VERSION }}

      - name: Patch flutter
        run: |
          cd "$(dirname "$(dirname "$(which flutter)")")"
          if [[ -f "${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff" ]]; then
            git apply "${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff" || true
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android
          components: rustfmt

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          link-to-sdk: true

      - name: Build Rust Android lib
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cargo install cargo-ndk --version ${{ env.CARGO_NDK_VERSION }} --locked
          ./flutter/ndk_arm64.sh
          mkdir -p ./flutter/android/app/src/main/jniLibs/arm64-v8a
          cp ./target/aarch64-linux-android/release/liblibrustdesk.so \
             ./flutter/android/app/src/main/jniLibs/arm64-v8a/librustdesk.so
          cp "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" \
             ./flutter/android/app/src/main/jniLibs/arm64-v8a/

      - name: Build APK
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          export PATH=/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH
          sed -i "s/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g" ./flutter/android/gradle.properties || true
          sed -i "s/signingConfigs.release/signingConfigs.debug/g" ./flutter/android/app/build.gradle
          pushd flutter
          flutter build apk --release --target-platform android-arm64 --split-per-abi
          popd
          mkdir -p dist
          cp flutter/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             dist/RevCore-Remote-Android-arm64.apk
          ls -lah dist/

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-revcore-android-arm64-${{ env.TAG }}
          path: dist/**
          if-no-files-found: error
