# Build RustDesk Windows x64 with RevCore server baked in (OSS, no Pro).
# Mirrors rustdesk/rustdesk flutter-build Windows x64 + bake of remote.r3v.ro.

name: Build Windows (RevCore)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "rustdesk/rustdesk git tag"
        required: true
        default: "1.5.0"

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag }}
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  FLUTTER_BRIDGE_VERSION: "3.22.3"
  RUST_VERSION: "1.75"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  CARGO_EXPAND_VERSION: "1.0.95"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  generate-bridge:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout rustdesk
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: ${{ env.TAG }}
          submodules: recursive
          fetch-depth: 1

      - name: Install prerequisites
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake curl gcc git g++ libclang-dev \
            libgtk-3-dev llvm-dev nasm ninja-build pkg-config wget

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt

      - name: Install flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_BRIDGE_VERSION }}
          cache: true

      - name: Install flutter rust bridge deps
        shell: bash
        run: |
          cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
          # Flutter 3.22.3: extended_text 14 needs newer Dart
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml || true
          pushd flutter && flutter pub get && popd

      - name: Run flutter rust bridge
        run: |
          ~/.cargo/bin/flutter_rust_bridge_codegen \
            --rust-input ./src/flutter_ffi.rs \
            --dart-output ./flutter/lib/generated_bridge.dart \
            --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h

      - name: Upload bridge artifact
        uses: actions/upload-artifact@v4
        with:
          name: bridge-artifact
          path: |
            ./src/bridge_generated.rs
            ./src/bridge_generated.io.rs
            ./flutter/lib/generated_bridge.dart
            ./flutter/lib/generated_bridge.freezed.dart
            ./flutter/macos/Runner/bridge_generated.h
            ./flutter/ios/Runner/bridge_generated.h

  windows-x64:
    needs: generate-bridge
    runs-on: windows-2022
    timeout-minutes: 240
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout rustdesk
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: ${{ env.TAG }}
          submodules: recursive
          fetch-depth: 1

      - name: Restore bridge files
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: ./

      - name: Checkout bake script
        uses: actions/checkout@v4
        with:
          path: _revcore
          sparse-checkout: |
            scripts/bake_server.py
          sparse-checkout-cone-mode: false

      - name: Bake RevCore server + key
        shell: pwsh
        env:
          RENDEZVOUS_SERVER: ${{ secrets.RENDEZVOUS_SERVER }}
          RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}
        run: |
          python _revcore/scripts/bake_server.py
          Select-String -Path libs/hbb_common/src/config.rs -Pattern 'RS_PUB_KEY|PROD_RENDEZVOUS_SERVER|RENDEZVOUS_SERVERS' | Select-Object -First 10

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        id: flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Replace engine with rustdesk custom flutter engine
        shell: pwsh
        run: |
          flutter doctor -v
          flutter precache --windows
          $flutterRoot = $env:FLUTTER_ROOT
          if (-not $flutterRoot) { $flutterRoot = "${{ steps.flutter.outputs.CACHE-PATH }}" }
          if (-not $flutterRoot) { $flutterRoot = (Resolve-Path (Join-Path (Split-Path (Get-Command flutter).Source -Parent) "..")).Path }
          $engine = Join-Path $flutterRoot "bin\cache\artifacts\engine\windows-x64-release"
          Write-Host "FLUTTER_ROOT=$flutterRoot"
          Write-Host "ENGINE_DIR=$engine"
          if (-not (Test-Path $engine)) { throw "Engine dir missing: $engine" }
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          if (Test-Path windows-x64-release) { Remove-Item -Recurse -Force windows-x64-release }
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          $src = "windows-x64-release"
          $nested = Join-Path $src "windows-x64-release"
          if (Test-Path $nested) { $src = $nested }
          Get-ChildItem $src -Force | ForEach-Object {
            Copy-Item -Force -Recurse $_.FullName -Destination $engine
            Write-Host "copied $($_.Name)"
          }

      - name: Patch flutter dropdown (3.24.5)
        shell: bash
        run: |
          if [ -f .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff ]; then
            cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff "$(dirname "$(dirname "$(which flutter)")")"
            cd "$(dirname "$(dirname "$(which flutter)")")"
            git apply flutter_3.24.4_dropdown_menu_enableFilter.diff || true
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: windows-2022-revcore-${{ env.TAG }}

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        shell: bash
        run: |
          if ! "$VCPKG_ROOT/vcpkg" \
            install \
            --triplet x64-windows-static \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
            done
            exit 1
          fi

      - name: Build rustdesk (Flutter Windows)
        shell: pwsh
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          if (-not (Test-Path .\flutter\build\windows\x64\runner\Release\rustdesk.exe)) {
            throw "rustdesk.exe missing after build"
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Recurse -Force .\flutter\build\windows\x64\runner\Release\* dist\
          Get-ChildItem dist

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-revcore-windows-${{ env.TAG }}
          path: dist/**
          if-no-files-found: error
